<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Upload helper</title></head>
<body style="font:16px system-ui;padding:20px">Preparing upload…
<script>
// Helper for posting our own pin media: opened by the Pinterest pin creation tab,
// fetches a file from this site and hands it back to that tab. ?f=pins/name.mp4
(async () => {
  const f = new URLSearchParams(location.search).get('f') || '';
  if (!/^pins\/[\w.-]+\.(mp4|png|jpg)$/.test(f) || !window.opener) { document.body.textContent = 'Nothing to do.'; return; }
  const blob = await (await fetch('/' + f, { cache: 'no-store' })).blob();
  window.opener.postMessage({ type: 'uff-media', name: f.split('/')[1], blob }, 'https://www.pinterest.com');
  document.body.textContent = 'Sent ' + f + ' (' + blob.size + ' bytes). You can close this tab.';
  setTimeout(() => window.close(), 1500);
})();
</script></body></html>
